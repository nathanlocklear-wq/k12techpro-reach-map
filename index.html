<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>K12TechPro Reach Maps</title>

<div id="app">
<header>
  <div class="brand"><img src="assets/k12techpro-logo.svg"><div><div class="brand-title">Reach Maps</div><div class="brand-sub">K12TechPro school outreach</div></div></div>

<div id="filterPanel" class="panel">

  <button data-filter="Contacted">Contacted</button>
  <button data-filter="Not on Pro">Not on Pro</button>
</div>

<div id="loading">Loading schools…</div>
</div>
